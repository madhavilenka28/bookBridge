<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Community Members</title>
    <link rel="stylesheet" href="css/community.css">
</head>
<body>
    <h1> Our Community Family </h1>
    <div class="stats-container">

    <div class="stat-card">
        <h2>20</h2>
        <p>Total Members</p>
    </div>

    <div class="stat-card">
        <h2>25</h2>
        <p>Books Shared</p>
    </div>

    <div class="stat-card">
        <h2>555</h2>
        <p>Books Read</p>
    </div>

    <div class="stat-card">
        <h2>20</h2>
        <p>Active Readers</p>
    </div>

</div>

    <div class="container">

        

        <div class="search-box">
            <input type="text" placeholder="Search Members...">
        </div>

        <div class="members-list">

            <div class="member-card">
                <img src="https://via.placeholder.com/80" alt="Profile">
                
                <div class="member-info">
                    <h3>Alice Johnson</h3>
                    <p>Book Lover | 25 Books Read</p>
                </div>
                <a href="profile.html">
                <button>View Profile</button>
                </a>
            </div>

            <div class="member-card">
                <img src="https://via.placeholder.com/80" alt="Profile">

                <div class="member-info">
                    <h3>Rahul Kumar</h3>
                    <p>Fiction Reader | 18 Books Read</p>
                </div>
                <a href="profile.html">
                <button>View Profile</button>
                </a>
            </div>

            <div class="member-card">
                <img src="https://via.placeholder.com/80" alt="Profile">

                <div class="member-info">
                    <h3>Priya Sharma</h3>
                    <p>Self-help Enthusiast | 30 Books Read</p>
                </div>
                <a href="profile.html">
                <button>View Profile</button>
                </a>
            </div>

        </div>

    </div>

</body>
</html>
