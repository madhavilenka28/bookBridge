<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Grow together By reading books</title>
    <link rel="stylesheet" href="css/home.css">
    <!-- Front awesome icons -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!--sidebar-->
    <div class="sidebar">
        <h2>Book Community</h2>
        <ul>
            <li><i class="fa-solid fa-house"></i>Home</li>
            <li><i class="fa-solid fa-book"></i>Books</li>
            <li><i class="fa-solid fa-clock"></i>Waiting List</li>
            <li><i class="fa-solid fa-users"></i>Community</li>
        </ul>
        </div>

    <!-- Main content -->
     <div class="main">
        <!--Navbar-->
        <div class="navbar"><input type="text" placeholder="Search books,members...">
            <div class="profile">Madhu</div>
            </div>
        <!--Hero section-->
        <section class="hero">
            <h1>Let's Grow Together<br>By Reading Books</h1>
            <p>Share books.Share knowledge.Share growth.</p>
            <button>Explore Books</button>
        </section>

        <!--Statistics-->
        <section class="stats">
            <div class="card">
                <h2>23</h2>
                <p>Members</p>
            </div>

           <div class="card">
                <h2>20</h2>
                <p>Books</p>
            </div> 

            <div class="card">
                <h2>15</h2>
                <p>Currently Reading</p>
            </div>

            </section>

            <!--Currently being read section-->
            <section class="reading-section">
             <h2>Currently Being Read</h2>
             <div class="reading-cards">
                <div class="reader-card">
                    <h3>Rahul</h3>
                    <p>Deep Work</p>
                    <div class="progress-bar">
                        <div class="progress" style="width:35%;"></div>
                        </div>
                        
                    <span>35%</span>
                </div>

                <div class="reader-card">
                    <h3>Priya</h3>
                    <p>Atomic Habits</p>
                    <div class="progress-bar">
                        <div class="progress" style="width:70%;"></div>
                        </div>
                        
                    <span>70%</span>
                </div>

                <div class="reader-card">
                    <h3>Vayuv</h3>
                    <p>Ikigai</p>
                    <div class="progress-bar">
                        <div class="progress" style="width:50%;"></div>
                        </div>
                        
                    <span>50%</span>
                </div>

             </div>
            </section>


    </div>    
</body>
</html>
